name = "notionworker-proxy"
main = "src/index.ts"
compatibility_date = "2024-12-30"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "notionworker-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# KV namespace binding for cache layer
[[kv_namespaces]]
binding = "SITE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

